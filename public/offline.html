<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · JRC Race Engineer</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #121110;
        color: #a09d96;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
        padding-top: calc(2rem + env(safe-area-inset-top, 0px));
      }
      img { width: 42vw; max-width: 200px; height: auto; opacity: 0.95; }
      h1 { color: #ece9e4; font-size: 1.05rem; font-weight: 700; margin: 0; }
      p { font-size: 0.85rem; line-height: 1.5; max-width: 20rem; margin: 0; }
      button {
        margin-top: 0.5rem;
        background: #ffd60a;
        color: #121110;
        border: none;
        border-radius: 8px;
        padding: 0.7rem 1.4rem;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/brand/jrc-mark-yellow.svg" alt="JRC Race Engineer" />
    <div>
      <h1>You're offline</h1>
      <p>No connection right now. Your logged runs are safe — reconnect to sync and keep going.</p>
    </div>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
