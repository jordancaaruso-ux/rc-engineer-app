# AI DRAFT — founder-corrected 2026-08-25 (JC pass, replacing the original AI draft).
# Cross-checked against toe.md / toe-and-scrub.md.
id: rear_toe_more
discipline: touring
change:
  parameter: toe_rear
  direction: increase
  typical_step: "0.5° per side; guides differ on the usual window — one caps on-road at 3°, another runs to 3.5°"
effects:
  - phase: all
    power: any
    end: rear
    feel: "more rear grip and more security, everywhere in the corner"
    confidence: consensus
  - phase: mid
    power: any
    end: car
    feel: "less rotation"
    confidence: consensus
  - phase: exit
    power: on-power
    end: rear
    feel: "more forward traction"
    confidence: consensus
  - phase: all
    power: any
    end: car
    feel: "it can cost straight-line speed — toed tyres scrub"
    confidence: consensus
secondary_effects:
  - "generally a car has more corner speed with LESS rear toe — the security is bought with pace"
  - "more rear tyre wear"
dose_response: to_a_point
modifiers:
  - context: "high-speed flowing track"
    action: amplifies
    note: "the stability gain matters most where commitment is highest; the scrub cost also grows with speed"
  - context: "tight technical track"
    action: attenuates
    note: "rotation matters more than stability there"
physics_link:
  - toe.md
  - concepts/toe-and-scrub.md
sources:
  - "Founder (JC), 2026-08-25"
  - "petitrc TouringCarSetting_V1 / RC CheatSheets"
