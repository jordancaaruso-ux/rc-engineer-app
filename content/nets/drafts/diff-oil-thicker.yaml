# AI DRAFT — founder-corrected 2026-08-25 (JC pass). Directions match the founder-confirmed signs
# in diff-and-driveline.md (touring: rear gear diff; the front is a spool).
id: diff_oil_thicker
discipline: touring
change:
  parameter: diff_oil
  direction: increase
  typical_step: "one grade; the steps are coarse, so expect a real change"
effects:
  - phase: entry
    power: off-power
    end: car
    feel: "less rotation off throttle — the car turns in steadier but lazier"
    confidence: consensus
  - phase: mid
    power: off-power
    end: car
    feel: "smoother and more consistent through the middle of the corner"
    confidence: majority
  - phase: exit
    power: on-power
    end: car
    feel: "more rotation on throttle"
    confidence: consensus
secondary_effects:
  - "the change is biggest in tight corners — that is where the rear wheels most need to differ in speed, so there is more coupling to feel"
  - "on-power steering and off-power steering move in OPPOSITE directions with this lever — name which one you are missing before touching it"
dose_response: to_a_point
modifiers:
  - context: "smooth, high-grip track"
    action: amplifies
    note: "the standard high-grip direction — the grip budget can afford the coupling"
  - context: "fast, flowing corners"
    action: attenuates
    note: "little speed difference between the rears at big radius — the lever has less to act on"
physics_link:
  - diff-and-driveline.md
  - concepts/differential-coupling.md
  - concepts/friction-circle.md
sources:
  - "Invisible Speed (Joseph Quagraine) — diff transcripts"
  - "On Road Setup Guide (Anthony Atack, XRAY T3) — rear differential section"
