# AI DRAFT — founder-corrected 2026-08-25 (JC pass), rebuilt to the v3 slider shape 2026-08-26.
# Touring: rear gear diff, front spool. On-power and off-power rotation move in OPPOSITE
# directions with this knob, which is why it is one slider and not a bite/hold move.
# WORD GAP: "rotation" is not on the closed feel list — awaiting the founder's additions.
id: diff_oil_thicker
discipline: touring
change:
  parameter: diff_oil
  direction: increase
  step: null            # a normal-sized move, founder-dictated; null = not set yet
moves:
  - slider: differential-coupling
    end: car
    toward: coupled
    confidence: consensus
feel: "more planted off throttle through mid-corner; more rotation on power"
physics:
  - diff-and-driveline.md
sources:
  - "Invisible Speed (Joseph Quagraine) — diff transcripts"
  - "On Road Setup Guide (Anthony Atack, XRAY T3) — rear differential section"
