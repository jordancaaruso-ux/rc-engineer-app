# AI DRAFT — founder-corrected 2026-08-25. The first draft had this contested (two period guides
# disagree on turn-in); the founder settled the direction, so the contested block is gone and his
# reading stands. Cross-checked against caster.md.
id: caster_front_more
discipline: touring
change:
  parameter: caster_front
  direction: increase
  typical_step: "one step — often a hub or insert swap, not a dial; touring runs between 0 and 8°"
effects:
  - phase: entry
    power: off-power
    end: front
    feel: "generally less initial steering — the nose waits a beat longer before it bites"
    confidence: majority
  - phase: mid
    power: any
    end: front
    feel: "more steering through the middle of the corner"
    confidence: majority
  - phase: exit
    power: on-power
    end: front
    feel: "more steering on the way out"
    confidence: majority
secondary_effects:
  - "most of caster's effect arrives WITH steering, not around centre — judge it in corners, not on the straight"
  - "a caster change moves the camber the tyre sees under lock — re-check static camber against wear after changing it"
dose_response: monotonic
physics_link:
  - caster.md
  - concepts/camber-grip.md
  - concepts/bite-hold.md
sources:
  - "Founder (JC), 2026-08-25 — direction settled against two disagreeing period guides"
  - "Scott Guyatt R/C Handbook — caster section (agrees on less initial turn-in)"
