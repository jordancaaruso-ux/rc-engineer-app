# AI DRAFT — founder-corrected 2026-08-25 (JC pass), transposed to the v2 fixed grid the same day.
# The founder settled the direction against two disagreeing period guides, so his reading stands
# and there is no contested block. Step size measured from 19 real changes across 5 drivers.
id: caster_front_more
discipline: touring
change:
  parameter: caster_front
  direction: increase
  typical_step: "1° is the usual move and 0.5° the smallest that registers — often a hub or insert swap, not a dial"
effects:
  - phase: entry
    end: front
    tag: grip_less
    feel: "generally less initial steering — the nose waits a beat longer before it bites"
    confidence: majority
  - phase: entry
    end: rear
    tag: none
  - phase: mid
    end: front
    tag: grip_more
    feel: "more steering through the middle of the corner"
    confidence: majority
  - phase: mid
    end: rear
    tag: none
  - phase: exit
    end: front
    tag: grip_more
    feel: "more steering on the way out"
    confidence: majority
  - phase: exit
    end: rear
    tag: none
dose_response: monotonic
physics_link:
  - caster.md
  - concepts/camber-grip.md
  - concepts/bite-hold.md
sources:
  - "Founder (JC), 2026-08-25 — direction settled against two disagreeing period guides"
  - "Scott Guyatt R/C Handbook — caster section (agrees on less initial turn-in)"
