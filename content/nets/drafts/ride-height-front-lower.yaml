# HUDY On Road Setup Guide, cross-checked against ride-height-and-rake.md.
id: ride_height_front_lower
discipline: touring
change:
  parameter: ride_height_front
  direction: decrease
  typical_step: "0.5 mm at a time; guides start around 5–5.5 mm and go higher on a bumpy track"
effects:
  - phase: all
    power: any
    end: car
    feel: "lower CoG means less total load transfer — the car reacts faster and carries more overall grip on a smooth surface"
    confidence: consensus
  - phase: entry
    power: off-power
    end: front
    feel: "lowering only the front takes rake out — turn-in sharpens slightly, and the car holds into the corner a touch less"
    confidence: majority
secondary_effects:
  - "it is not only a centre-of-gravity change — moving ride height moves the suspension geometry too (where the arms sit in their travel, so roll centres and static camber shift with it), and that second effect can be the one you actually feel"
  - "as a rule: as low as it will go without bottoming is better"
  - "a one-end change is a rake change — lowering both ends together changes the car without moving balance"
  - "too low and the chassis touches: the platform goes solid mid-corner and the car goes loose without warning"
  - "re-check ride height after tyre wear or any spring change"
dose_response: to_a_point
modifiers:
  - context: "bumpy track"
    action: reverses
    note: "the bottoming risk arrives before the CoG gain pays — raise it on bumps; the car reacts slower but stays off the deck"
  - context: "smooth, high-grip track"
    action: amplifies
    note: "the classic direction: as low as the surface allows, for response and less roll"
