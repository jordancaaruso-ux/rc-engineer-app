# AI DRAFT — not founder-reviewed. Drafted 2026-08-25, transposed to the v2 fixed grid the same day.
# Step size measured from 25 real consecutive-run ride-height changes across 5 drivers.
id: ride_height_front_lower
discipline: touring
change:
  parameter: ride_height_front
  direction: decrease
  typical_step: "0.2 mm is the usual move and about the smallest that registers; 0.4 mm is a big step"
effects:
  - phase: entry
    end: front
    tag: response_more
    feel: "taking rake out of the car sharpens turn-in slightly"
    confidence: majority
  - phase: entry
    end: rear
    tag: none
  - phase: mid
    end: front
    tag: grip_less
    feel: "the car holds into the corner a touch less"
    confidence: majority
  - phase: mid
    end: rear
    tag: none
  - phase: exit
    end: front
    tag: none
  - phase: exit
    end: rear
    tag: none
overall: "lower means less total load transfer — faster reactions and more overall grip on a smooth track; it also moves the geometry, which can be what you actually feel"
dose_response: to_a_point
modifiers:
  - context: "bumpy track"
    action: reverses
    note: "the bottoming risk arrives before the lower centre of gravity pays; raise it on bumps — the car reacts slower but stays off the deck"
  - context: "smooth, high-grip track"
    action: amplifies
    note: "as low as it will go without bottoming is better here; too low and the chassis touches, the platform goes solid mid-corner and the car goes loose without warning"
physics_link:
  - ride-height-and-rake.md
  - concepts/load-transfer.md
  - concepts/roll-center.md
  - concepts/bump-compliance.md
sources:
  - "HUDY / Anthony Atack On Road Setup Guide — ride height table"
  - "Invisible Speed (Joseph Quagraine) — ride height transcripts (adjust for traction level; measure the same way every time)"
