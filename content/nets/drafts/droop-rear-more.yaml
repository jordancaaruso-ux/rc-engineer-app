# AI DRAFT — founder-corrected 2026-08-25 (JC pass). Drafted from Invisible Speed transcripts +
# HUDY On Road Setup Guide, cross-checked against droop-downstop.md.
id: droop_rear_more
discipline: touring
change:
  parameter: droop_rear
  direction: increase
  typical_step: "0.5 mm of travel; read the sheet's column direction before comparing"
effects:
  - phase: entry
    power: off-power
    end: car
    feel: "often more rotation on entry — the car turns in more freely"
    confidence: consensus
  - phase: entry
    power: braking
    end: rear
    feel: "the rear extends further before topping out, so the rear tyres stay loaded into the corner instead of going light"
    confidence: consensus
  - phase: all
    power: any
    end: car
    feel: "a wider working window before a wheel tops out and the load transfers all at once"
    confidence: consensus
secondary_effects:
  - "when rear droop is too limited the rear can lose grip suddenly — that abruptness is the sign you have run out of it"
  - "less rear droop makes the car quicker to square up and go"
  - "re-check droop after any ride height or shock change"
dose_response: to_a_point
modifiers:
  - context: "bumpy track"
    action: amplifies
    note: "braking over bumps is where the extending rear earns its keep — the tyre follows the surface instead of skipping"
physics_link:
  - droop-downstop.md
  - concepts/bump-compliance.md
  - concepts/load-transfer.md
  - concepts/corner-regime.md
sources:
  - "Invisible Speed (Joseph Quagraine) — droop / working range transcripts"
  - "HUDY / Anthony Atack On Road Setup Guide — rear droop table"
