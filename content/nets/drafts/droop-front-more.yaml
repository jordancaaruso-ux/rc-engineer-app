# AI DRAFT — founder-corrected 2026-08-25 (JC pass), transposed to the v2 fixed grid the same day.
# NO measured step: droop deltas in real data run 0.2 mm at the median and 16.6 mm at the 75th
# percentile, which is two sheet conventions in one column rather than a big move. Qualitative only.
id: droop_front_more
discipline: touring
change:
  parameter: droop_front
  direction: increase
  typical_step: "one small step — sheets disagree on whether a bigger number means more or less, so read the column"
effects:
  - phase: entry
    end: front
    tag: response_less
    feel: "smoother initially — the steering comes in gently rather than all at once"
    confidence: consensus
  - phase: entry
    end: rear
    tag: none
  - phase: mid
    end: front
    tag: grip_more
    feel: "the front keeps gaining grip through the corner for longer, so there is more steering in the middle"
    confidence: consensus
  - phase: mid
    end: rear
    tag: none
  - phase: exit
    end: front
    tag: grip_more
    feel: "the steering is still with you coming out — more exit steering"
    confidence: consensus
  - phase: exit
    end: rear
    tag: none
overall: "a wider working window — the car can pitch and roll further before a wheel tops out and the load transfers all at once"
dose_response: to_a_point
modifiers:
  - context: "high grip"
    action: amplifies
    note: "less droop turns too reactive when the grip is up; more droop is the calmer, more drivable car there"
  - context: "low grip"
    action: reverses
    note: "less front droop can be the MORE forgiving car on a loose track — the front does not want to over-rotate the car, especially on exit"
physics_link:
  - droop-downstop.md
  - concepts/bump-compliance.md
  - concepts/load-transfer.md
  - concepts/corner-regime.md
sources:
  - "Invisible Speed (Joseph Quagraine) — droop / working range transcripts"
  - "HUDY / Anthony Atack On Road Setup Guide — front droop table"
