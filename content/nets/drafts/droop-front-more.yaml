# AI DRAFT — founder-corrected 2026-08-25 (JC pass), rebuilt to the v3 slider shape 2026-08-26.
# GAP: droop's main effect is the working range — how far the car can pitch and roll before a
# wheel tops out and the load transfers all at once. There is no concepts/ file for that slider,
# so it cannot be pointed at yet. What is here is the part that maps onto existing sliders.
id: droop_front_more
discipline: touring
change:
  parameter: droop_front
  direction: increase
  step: null            # a normal-sized move, founder-dictated; null = not set yet
moves:
  - slider: bump-compliance
    end: front
    toward: better
    confidence: consensus
  - slider: bite-hold
    end: front
    toward: hold
    confidence: majority
feel: "the front comes in smoother and holds on for longer"
physics:
  - droop-downstop.md
sources:
  - "Invisible Speed (Joseph Quagraine) — droop / working range transcripts"
  - "HUDY / Anthony Atack On Road Setup Guide — front droop table"
