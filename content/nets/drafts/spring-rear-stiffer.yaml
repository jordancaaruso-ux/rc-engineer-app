# AI DRAFT — founder-corrected 2026-08-25 (JC pass), transposed to the v2 fixed grid the same day.
# Step size measured from 36 real consecutive-run spring changes across 4 drivers.
# Cell filled from the physics KB rather than a source during the transpose: entry/rear.
id: spring_rear_stiffer
discipline: touring
change:
  parameter: spring_rear
  direction: increase
  typical_step: "about 5 gf/mm is the usual move — roughly one rate step in most ranges; 2.5 gf/mm is the smallest that registers"
effects:
  - phase: entry
    end: front
    tag: none
  - phase: entry
    end: rear
    tag: grip_earlier
    feel: "the rear takes its load sooner, so its grip is there earlier from the first steering input"
    confidence: majority
  - phase: mid
    end: front
    tag: none
  - phase: mid
    end: rear
    tag: grip_less
    feel: "once roll has settled the rear carries the bigger share and gives up side grip — the car rotates more; too far and the rear slides"
    confidence: consensus
  - phase: exit
    end: front
    tag: grip_more
    feel: "more steering on power, and the rear stays flatter instead of squatting onto the outside tyre"
    confidence: consensus
  - phase: exit
    end: rear
    tag: stability_more
    feel: "more rear support on exit — the car drives straighter off the corner instead of wandering about"
    confidence: consensus
overall: "more rear grip in quick direction changes"
dose_response: to_a_point
modifiers:
  - context: "high grip, hard on-power cornering"
    action: amplifies
    note: "the support matters most where the forces are biggest — a rear that collapses onto the outside tyre on power is what needs the stiffness"
  - context: "bumpy track"
    action: attenuates
    note: "stiffer passes bumps into the chassis; the rear skips instead of gripping"
physics_link:
  - spring-rate.md
  - concepts/roll-stiffness.md
  - concepts/corner-regime.md
  - concepts/bite-hold.md
  - concepts/bump-compliance.md
sources:
  - "On Road Setup Guide (Anthony Atack, XRAY T3) — rear springs table"
  - "Invisible Speed (Joseph Quagraine) — TITC + rear-support transcripts"
