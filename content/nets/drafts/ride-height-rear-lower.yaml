# HUDY On Road Setup Guide, cross-checked against ride-height-and-rake.md.
id: ride_height_rear_lower
discipline: touring
change:
  parameter: ride_height_rear
  direction: decrease
  typical_step: "0.5 mm at a time; guides start around 5–5.5 mm and go higher on a bumpy track"
effects:
  - phase: all
    power: any
    end: car
    feel: "lower CoG, less total transfer — a faster-reacting car with more overall grip on a smooth surface"
    confidence: consensus
  - phase: entry
    power: off-power
    end: car
    feel: "lowering only the rear adds rake toward the front — less steering into the corner and less hold once in it"
    confidence: majority
  - phase: exit
    power: on-power
    end: rear
    feel: "the rear sits deeper and has less far to squat on power — steadier accelerating"
    confidence: majority
secondary_effects:
  - "it is not only a centre-of-gravity change — moving ride height moves the suspension geometry too, and that second effect can be the one you actually feel"
  - "as a rule: as low as it will go without bottoming is better"
  - "a one-end change is a rake change — the balance moves with it"
  - "too low and the chassis touches under squat: sudden looseness on power with no warning"
dose_response: to_a_point
modifiers:
  - context: "bumpy track"
    action: reverses
    note: "raise it — bottoming under power on bumps costs more than the CoG gain pays"
  - context: "smooth, high-grip track"
    action: amplifies
    note: "as low as the surface allows"
physics_link:
