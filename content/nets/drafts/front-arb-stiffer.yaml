# AI DRAFT — founder-corrected 2026-08-25 (JC pass), transposed to the v2 fixed grid the same day.
# Step size measured from 39 real consecutive-run bar changes across 5 drivers.
id: front_arb_stiffer
discipline: touring
change:
  parameter: arb_front
  direction: increase
  typical_step: "0.1 mm is both the smallest move that registers and the usual one; 0.2 mm is a big step"
effects:
  - phase: entry
    end: front
    tag: grip_earlier
    feel: "the front takes its load sooner, so its grip arrives earlier — sharper turn-in, and the car sets into the corner quicker"
    confidence: consensus
  - phase: entry
    end: rear
    tag: none
  - phase: mid
    end: front
    tag: grip_less
    feel: "once roll has settled the front carries the bigger share of the transfer and gives up side grip — the car pushes"
    confidence: consensus
  - phase: mid
    end: rear
    tag: stability_more
    feel: "the rear gains grip relative to the front, so the car is steadier behind"
    confidence: majority
  - phase: exit
    end: front
    tag: none
  - phase: exit
    end: rear
    tag: none
overall: "the car changes direction sooner after the steering input and rolls less doing it; too stiff for the grip level makes it twitchy around straight-ahead"
dose_response: to_a_point
modifiers:
  - context: "extremely high grip, where the car has stopped sliding"
    action: reverses
    note: "a thinner front bar gives you time to react, which makes the car easier to drive; a stiff bar leaves none. Grip level to bar thickness is not a straight line"
  - context: "tight, low-speed corners"
    action: amplifies
    note: "a chicane or a flick is over before roll finishes, so it is all entry and a stiffer front bar is close to pure gain; a hairpin has a short settled middle where the loss shows"
physics_link:
  - arb.md
  - concepts/roll-stiffness.md
  - concepts/tyre-load-sensitivity.md
  - concepts/corner-regime.md
  - concepts/bite-hold.md
sources:
  - "Invisible Speed (Joseph Quagraine) — anti-roll bar video + course meeting transcripts"
  - "On Road Setup Guide (Anthony Atack, XRAY T3) — front sway bar table; agrees"
