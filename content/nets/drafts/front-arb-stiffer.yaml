# AI DRAFT — founder-corrected 2026-08-25 (JC pass), rebuilt to the v3 slider shape 2026-08-26.
# The old entry carried its own high-grip reversal. That is not a reversal: high grip slides the
# bite/hold good spot toward hold, so a car already at the bite end is now past it. The rule lives
# in bite-hold.md now, once, instead of here and in fifteen other files.
id: front_arb_stiffer
discipline: touring
change:
  parameter: arb_front
  direction: increase
  step: null            # a normal-sized move, founder-dictated; null = not set yet
moves:
  - slider: bite-hold
    end: front
    toward: bite
    confidence: consensus
  - slider: bite-hold
    end: rear
    toward: hold
    confidence: majority
    relative: true
  - slider: roll-stiffness
    end: front
    toward: stiffer
    confidence: consensus
feel: "the front gets more pointy and precise; the rear feels more planted behind it"
physics:
  - arb.md
sources:
  - "Invisible Speed (Joseph Quagraine) — anti-roll bar video + course meeting transcripts"
  - "On Road Setup Guide (Anthony Atack, XRAY T3) — front sway bar table; agrees"
