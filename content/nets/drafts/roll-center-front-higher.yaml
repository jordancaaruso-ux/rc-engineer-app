# AI DRAFT — awaiting founder review. Third sweep, 2026-08-27. Drafted from the physics KB's own
# effects notes (roll-centre files are solver-checked and founder-verified for DIRECTION; the outcome
# lines here are the nets' addition). Invisible Speed transcripts NOT consulted for this set.
# `roll_center_*` is not a sheet key — it is what the shim keys move. Higher RC, per 0.5 mm shim added:
# under_lower_arm (~1.1 mm, the strongest), under_hub (~1.05), upper_outer (~0.5); upper_inner LOWERS it
# (~0.5). Ride height up also raises it. Lower RC is the mirror: more in the track, more hold, more roll.
id: roll_center_front_higher
discipline: touring
change:
  parameter: roll_center_front
  direction: increase
  step: null            # a normal-sized move, founder-dictated; null = not set yet
roll_lever: true
before_settled: "more front bite — more initial steering, and the front feels more on the track"
once_settled: "more support, so the front rolls less and holds its shape; too high and it goes over-supported — little roll, then it gives up grip mid-corner"
confidence: majority
physics:
  - under-lower-arm.md
  - under-hub.md
  - upper-link-geometry.md
sources:
  - "under-lower-arm.md / upper-link-geometry.md effects notes (solver-verified 2026-08-01)"
  - "concepts/on-in-track.md"
