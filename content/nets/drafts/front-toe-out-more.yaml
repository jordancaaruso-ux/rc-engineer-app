# AI DRAFT — not founder-reviewed. Drafted 2026-08-25. The straight-line effect is genuinely
# split across trusted sources (HUDY guide vs Guyatt handbook + Associated CheatSheets), so it
# carries a contested block. Cross-checked against toe.md / toe-and-scrub.md.
id: front_toe_out_more
discipline: touring
change:
  parameter: toe_front
  direction: increase
  typical_step: "0.1–0.5° per side toward toe-out (touring fronts run between −1° in and +1° out); increase here means MORE TOE-OUT, the touring front convention. Sheet signs differ — confirm which way yours counts"
effects:
  - phase: entry
    power: off-power
    end: front
    feel: "more overall steering and a gentler response right around centre — easier to be smooth with"
    confidence: majority
  - phase: all
    power: any
    end: car
    feel: "toed tyres scrub — a touch of straight-line speed and tyre life goes with every degree"
    confidence: consensus
  - phase: all
    power: any
    end: front
    feel: "what it does to straight-line stability is disputed — see the two claims below"
    confidence: contested
secondary_effects:
  - "one of the smallest worthwhile changes on the car — top drivers move it by 0.1° to trim steering feel between runs"
  - "the tyre runs static toe PLUS bump steer through travel — check the pair together"
dose_response: to_a_point
modifiers:
  - context: "high-speed sweepers"
    action: amplifies
    note: "the gentle-off-centre character is worth most where a twitch costs most"
contested:
  claim_a: "majority (HUDY guide, and how it is trimmed in practice): a little toe-out makes the car track straighter and feel more settled at speed, with more overall steering"
  claim_b: "minority (Guyatt handbook, Associated CheatSheets): toe-out makes the car wander on the straight and go nervous over bumps; toe-in is what steadies the straight"
  discriminator: "watch the straight: if the car hunts side to side over bumps at speed, you have too much toe-out for this surface — go toward in; if it is planted but lazy off-centre, you can afford more out"
physics_link:
  - toe.md
  - concepts/toe-and-scrub.md
  - concepts/loaded-wheel.md
sources:
  - "HUDY / Anthony Atack On Road Setup Guide — front toe table"
  - "Scott Guyatt R/C Handbook — toe section"
  - "Associated RC CheatSheets — front toe page"
  - "Invisible Speed (Joseph Quagraine) — TITC transcripts (0.1° trims between rounds)"
