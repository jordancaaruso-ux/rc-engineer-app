# AI DRAFT — not founder-reviewed. Drafted 2026-08-25, rebuilt to the v3 slider shape 2026-08-26.
# NOTE: no bite-hold move, deliberately. bite-hold.md is explicit and founder-confirmed:
# damping changes WHEN the load gets there without changing the roll angle the car ends up at,
# so slowing the movement does not buy bite. Damper oil moves the damping slider and nothing else.
id: damper_oil_front_thicker
discipline: touring
change:
  parameter: damper_oil_front
  direction: increase
  step: null            # a normal-sized move, founder-dictated; null = not set yet
moves:
  - slider: damping
    end: front
    toward: slower
    confidence: consensus
  - slider: bump-compliance
    end: front
    toward: worse
    confidence: consensus
feel: "the front moves slower and feels more forgiving; too far and it goes imprecise"
physics:
  - damper-oil.md
sources:
  - "Invisible Speed (Joseph Quagraine) — shock oil / temperature / piston transcripts"
  - "On Road Setup Guide (Anthony Atack, XRAY T3) — shock oil table"
