# AI DRAFT — founder-corrected 2026-08-25 (JC pass). Cross-checked against camber.md / camber-grip.md.
id: camber_front_more_negative
discipline: touring
change:
  parameter: camber_front
  direction: increase
  typical_step: "0.5°; published touring guides put most setups near −1° to −2°, and never positive"
effects:
  - phase: mid
    power: any
    end: front
    feel: "normally more steering, and most of it in the middle of the corner"
    confidence: consensus
  - phase: mid
    power: any
    end: front
    feel: "going over the edge becomes more abrupt — when the front does let go, it lets go with less warning"
    confidence: majority
  - phase: all
    power: braking
    end: front
    feel: "braking and straight-line grip can suffer — the patch is fullest with the tyre upright"
    confidence: majority
secondary_effects:
  - "how much of any of this you get depends heavily on the tyre"
  - "the optimum moves with the tyre and with track temperature — it is found by testing and wear pattern, not a fixed number"
  - "the tyre runs its static camber PLUS what roll adds — a roll-centre or spring change moves effective camber without touching this setting"
dose_response: to_a_point
modifiers:
  - context: "a different tyre or a big track-temperature swing"
    action: attenuates
    note: "the optimum moved — re-find it rather than trusting the old number"
  - context: "high-grip surface where the car rolls hard"
    action: amplifies
    note: "more roll means the loaded tyre leans further from vertical, so the static camber has more correcting to do"
physics_link:
  - camber.md
  - concepts/camber-grip.md
  - concepts/camber-gain.md
sources:
  - "Invisible Speed (Joseph Quagraine) — camber transcripts"
  - "On Road Setup Guide (Anthony Atack, XRAY T3) — front camber table"
