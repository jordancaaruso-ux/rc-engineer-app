id: camber_rear_more_negative
discipline: touring
change:
  parameter: camber_rear
  direction: increase
  typical_step: "0.5° of negative camber (touring rears typically run −1° to −2°); never positive"
effects:
  - phase: mid
    power: any
    end: rear
    feel: "more rear side grip and security once the car has rolled — the rear holds on through the corner"
    confidence: consensus
  - phase: exit
    power: on-power
    end: rear
    feel: "a shade less forward drive — the patch is fullest at zero camber, and every degree leans some of it away"
    confidence: consensus
secondary_effects:
  - "how much of any of this you get depends heavily on the tyre"
  - "reducing rear camber a touch is a quiet way to add forward drive when corner security is already good"
  - "the optimum is tyre- and temperature-specific — wear pattern across the tyre face is the evidence"
dose_response: to_a_point
modifiers:
  - context: "a different tyre or a big track-temperature swing"
    action: attenuates
    note: "re-find the optimum; the old number belonged to the old rubber"
  - context: "long fast corners"
    action: amplifies
    note: "the rear spends longer leaned over, so the mid-corner gain is worth more of the lap"
