# FOUNDER-REVIEWED 2026-08-27 (JC pass) — promoted to the locked tier. Third sweep, founder-corrected 2026-08-27 (two passes). Roll-centre
# direction per key is solver-checked (upper-link-geometry.md); the feel lines are the founder's.
# Founder: the lower-arm stack is mostly about SUPPORT, and initial grip — not only support. The strongest
# roll-centre lever (~1.1 mm per 0.5 mm shim); adds camber gain with it.
# `under_lower_arm_shims_front` = the FRONT stack, ff and fr raised together. The ff/fr SPLIT is anti-dive, a separate entry.
# v5 (2026-08-27): one entry per knob, both directions inside. The MORE side is the founder-reviewed text
# carried over from under-lower-arm-front-more.yaml; the LESS side is AI-DRAFTED by inversion and awaits his pass (reviewed: false).
# Founder, 2026-08-28: the relative change (front against rear) counts as much as the change itself — said on every side. An earlier
# wording, "front against rear is what you feel", read as "balance lever" and made these keys vanish from whole-car answers.
# Founder, 2026-08-28: the relative change (front against rear) counts as much as the change itself — said on every side. An earlier
# wording, "front against rear is what you feel", read as "balance lever" and made these keys vanish from whole-car answers.
id: under_lower_arm_shims_front
discipline: touring
parameter: under_lower_arm_shims_front
label: "Front under-lower-arm shims"
words:
  more: "more — roll centre up"
  less: "fewer — roll centre down"
step: "0.5 mm; 0.25 mm is a small change, still noticeable"   # founder-dictated 2026-08-29; direction lives in the words, not here (a pickup-height step inverted upper-outer once, 12:45 same day)
two_answers: true
# Founder, 2026-08-27 (second pass): "support" is not something a driver feels — lead with what they do feel: more direct,
# precise, stiff. And on this key the front RELATIVE to the rear is as important as the change itself, if not more.
more:
  reviewed: true
  confidence: majority
  before_settled: "feels more direct and precise from the first input — stiffer, more on the track, more initial grip — though less of a bite change than the upper links give"
  once_settled: "tends toward understeer mid-corner; front against rear counts as much as the change itself"
less:
  reviewed: false
  confidence: majority
  before_settled: "feels less direct from the first input — softer, more in the track, less initial grip — though less of a bite change than the upper links give"
  once_settled: "tends toward more front grip mid-corner — less understeer; front against rear counts as much as the change itself"
physics:
  - under-lower-arm.md
sources:
  - "upper-link-geometry.md roll-centre table (solver-verified 2026-08-01)"
  - "Founder (JC), 2026-08-27 — lower arm = support + initial grip; upper links = bite + overall-grip feel; rear settled hedged like bar and spring"
  - "Opposite side: AI-drafted by inversion of the founder-reviewed side, 2026-08-27"
