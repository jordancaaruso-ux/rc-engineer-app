id: top_deck_front
discipline: touring
parameter: top_deck_front
label: "Front chassis flex"
words:
  more: "stiffer at the front"
  less: "more front flex"
step: "one screw ahead of the spur gear on the motor mount or top deck, or one less cut in the front top deck — flex screws move toward the front"   # founder-dictated 2026-08-27
two_answers: true
more:
  reviewed: false
  confidence: majority
  before_settled: "the front bites sooner — a little more initial steering, and it comes in more abruptly"
  once_settled: "less front grip through the middle — the tyre gives before the front does — and less forgiving over bumps at that end"
less:
  reviewed: true
  confidence: majority
  before_settled: "the front bites later, so a little less initial steering, and it comes in more gently"
  once_settled: "more front grip through the middle — the front gives before the tyre does — and more forgiving over bumps at that end"
