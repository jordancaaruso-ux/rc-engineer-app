# FOUNDER-REVIEWED 2026-08-27 (JC pass) — promoted to the locked tier. Founder-corrected content from the 2026-08-25 pass carried
# over; shape rebuilt 2026-08-27 (interview): outcomes only, in the driver's words.
# `increase` means MORE TOE-OUT, the touring front convention. Sheet signs differ.
# Founder, 2026-08-27 (after the first drive): it smooths the initial, which often reads as LESS steering, and can give
# more right in the middle. A fast car feels the first, a slow car the second — two answers, so two lines. Never a lever
# for "more steering overall" — the old single line said exactly that, and the Engineer reached for it on that word.
id: front_toe_out_more
discipline: touring
change:
  parameter: toe_front
  direction: increase
  step: "0.2° per side; even 0.1° is noticeable"   # founder-dictated 2026-08-27
roll_lever: true
before_settled: "smoother and less immediate on turn-in, so it often feels like less steering at first"
once_settled: "can give more steering right in the middle — not a lever for more steering overall; a touch of straight-line speed and tyre life goes with every degree"
confidence: majority
physics:
  - toe.md
sources:
  - "Founder (JC), 2026-08-27 — smooths the initial, more steering mid; never for overall steering"
  - "HUDY / Anthony Atack On Road Setup Guide — front toe table"
  - "Invisible Speed (Joseph Quagraine) — TITC transcripts (0.1° trims between rounds)"
