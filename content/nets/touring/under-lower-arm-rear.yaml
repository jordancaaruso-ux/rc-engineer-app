# FOUNDER-REVIEWED 2026-08-27 (JC pass) — promoted to the locked tier. Third sweep, founder-corrected 2026-08-27 (two passes). Roll-centre
# direction per key is solver-checked (upper-link-geometry.md); the feel lines are the founder's.
# Founder: the lower-arm stack is mostly about SUPPORT, and initial grip — not only support. The strongest
# roll-centre lever (~1.1 mm per 0.5 mm shim); adds camber gain with it.
# `under_lower_arm_shims_rear` = the REAR stack, rf and rr raised together. The rf/rr SPLIT is anti-squat, a separate entry.
# v5 (2026-08-27): one entry per knob, both directions inside. The MORE side is the founder-reviewed text
# carried over from under-lower-arm-rear-more.yaml; the LESS side is AI-DRAFTED by inversion and awaits his pass (reviewed: false).
id: under_lower_arm_shims_rear
discipline: touring
parameter: under_lower_arm_shims_rear
label: "Rear under-lower-arm shims"
words:
  more: "more"
  less: "fewer"
step: null   # a normal-sized move, founder-dictated; null = not set yet
two_answers: true
# Founder, 2026-08-27 (second pass): "support" is not something a driver feels — lead with what they do feel: more direct,
# stiff, secure. And on this key the rear RELATIVE to the front is as important as the change itself, if not more.
more:
  reviewed: true
  confidence: majority
  before_settled: "the rear feels more direct and stiff from the first input — more secure, more on the track — though less of a bite change than the upper links give"
  once_settled: "tends toward oversteer mid-corner, though it can go the other way; exit either way — and it is the rear against the front you feel"
less:
  reviewed: false
  confidence: majority
  before_settled: "the rear feels less direct from the first input — softer, less secure, more in the track — though less of a bite change than the upper links give"
  once_settled: "tends toward more rear grip mid-corner, though it can go the other way; exit either way; the rear against the front is what you feel"
physics:
  - under-lower-arm.md
sources:
  - "upper-link-geometry.md roll-centre table (solver-verified 2026-08-01)"
  - "Founder (JC), 2026-08-27 — lower arm = support + initial grip; upper links = bite + overall-grip feel; rear settled hedged like bar and spring"
  - "Opposite side: AI-drafted by inversion of the founder-reviewed side, 2026-08-27"
