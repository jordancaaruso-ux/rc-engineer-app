id: top_deck_rear
discipline: touring
parameter: top_deck_rear
label: "Rear chassis flex"
words:
  more: "stiffer at the rear"
  less: "more rear flex"
step: "one screw behind the spur gear on the motor mount or top deck, or one less cut in the rear top deck — flex screws move toward the rear"   # founder-dictated 2026-08-27
two_answers: true
more:
  reviewed: false
  confidence: majority
  before_settled: "the rear bites sooner — more secure from the first steering input, but less progressive"
  once_settled: "tends toward less rear grip through the middle and more rotation — the contested claim below, the other way"
less:
  reviewed: true
  confidence: contested
  before_settled: "the rear bites later — a little less secure from the first steering input, but more progressive"
  once_settled: "tends toward more rear grip through the middle and less rotation — the usual answer on a touring car"
  contested:   # founder 2026-09-02: "normally more rear grip", and the split relates to corner regime; discriminator reworded to an on-track observable 2026-09-03
    claim_a: "more rear flex gives more rear grip through the middle and less rotation"
    claim_b: "the stiffer rear is the one with the rear grip, and more flex gives rotation instead"
    discriminator: "make the change and compare the long, slow turns against the quick direction changes: better in the quick ones and worse in the long ones means the stiffer rear has gone too far"
physics:
  - flex-chassis.md
sources:
  - "flex-chassis.md + concepts/chassis-flex.md (rear-half adjusters bias rear flex)"
  - "Founder (JC), 2026-08-27 — flex relativity; often less rear flex = more rear grip, physics not yet understood"
  - "Opposite side: AI-drafted by inversion of the founder-reviewed side, 2026-08-27"
