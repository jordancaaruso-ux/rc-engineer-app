# FOUNDER-REVIEWED 2026-08-27 (JC pass) — promoted to the locked tier. Founder-corrected content from the 2026-08-25 pass carried
# over; shape rebuilt 2026-08-27 (interview): outcomes only, in the driver's words.
# ONCE SETTLED says "no change" on purpose: bite-hold.md is explicit and founder-confirmed that
# damping moves WHEN load arrives without changing the roll angle the car ends up at.
# v5 (2026-08-27): one entry per knob, both directions inside. The MORE side is the founder-reviewed text
# carried over from damper-oil-front-thicker.yaml; the LESS side is AI-DRAFTED by inversion and awaits his pass (reviewed: false).
id: damper_oil_front
discipline: touring
parameter: damper_oil_front
label: "Front damper oil"
words:
  more: "thicker"
  less: "thinner"
step: "50 cSt"   # founder-dictated 2026-08-27; 2026-08-28: 25 dropped, too small to bother with
two_answers: true
more:
  reviewed: true
  confidence: consensus
  before_settled: "the front rolls in slower, so the initial steering arrives calmer and more forgiving — not more of it; too far and it reacts too slowly, and is just slower"
  once_settled: "no change — damping only acts while the car is moving, and by the middle of the corner it is not"
less:
  reviewed: false
  confidence: consensus
  before_settled: "the front rolls in faster, so the initial steering arrives sooner — the same amount, there for longer, so it can feel like more; too far and it is too reactive"
  once_settled: "no change — damping only acts while the car is moving, and by the middle of the corner it is not"
physics:
  - damper-oil.md
sources:
  - "Invisible Speed (Joseph Quagraine) — shock oil / temperature / piston transcripts"
  - "On Road Setup Guide (Anthony Atack, XRAY T3) — shock oil table"
  - "Opposite side: AI-drafted by inversion of the founder-reviewed side, 2026-08-27"
