id: toe_gain_shims_rear
discipline: touring
parameter: toe_gain_shims_rear
label: "Rear toe gain (shims)"
words:
  more: "more shims — less toe gain"
  less: "fewer shims — more toe gain"
step: "half a shim, depending on how sensitive the car is — about 0.2° more gain from static ride height to compressed onto the board"   # founder-dictated 2026-08-27
two_answers: true
more:
  reviewed: false
  confidence: majority
  before_settled: "less change on the way in — the rear keeps more of its static toe, so more security on the first input"
  once_settled: "as less rear toe — a little less rear grip, more rotation, less forward traction — the toe stays nearer static as the car rolls and squats"
less:
  reviewed: true
  confidence: majority
  before_settled: "it extends on the way in, so less rear toe there — less security on the first input"
  once_settled: "as more rear toe — more rear grip, less rotation, more forward traction — arriving as the car rolls and squats"
