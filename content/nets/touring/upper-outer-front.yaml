# FOUNDER-REVIEWED 2026-08-27 (JC pass) — promoted to the locked tier. Third sweep, founder-corrected 2026-08-27 (two passes). Roll-centre
# direction per key is solver-checked (upper-link-geometry.md); the feel lines are the founder's.
# Founder: the upper links are about BITE — a big change in the amount of bite the car has — and the overall
# grip feel moves with them more than with the other keys. Outer and inner are the same lever from either
# end: what matters is the upper arm's angle. ~0.5 mm of RC per 0.5 mm shim, camber gain moves with it.
# Adding upper-OUTER shims raises RC.
# v5 (2026-08-27): one entry per knob, both directions inside. The MORE side is the founder-reviewed text
# carried over from upper-outer-front-more.yaml; the LESS side is AI-DRAFTED by inversion and awaits his pass (reviewed: false).
# Founder, 2026-08-28: the relative change (front against rear) counts as much as the change itself — said on every side. An earlier
# wording, "front against rear is what you feel", read as "balance lever" and made these keys vanish from whole-car answers.
id: upper_outer_shims_front
discipline: touring
parameter: upper_outer_shims_front
label: "Front upper-outer shims"
words:
  more: "more"
  less: "fewer"
step: "0.5 mm — raise or lower that pickup by 0.5 mm, however the car does it; 0.25 mm is a small change, still noticeable"   # founder-dictated 2026-08-29
two_answers: true
more:
  reviewed: true
  confidence: majority
  before_settled: "the biggest bite change of the roll-centre keys — noticeably more initial steering, and more on the track; front against rear counts as much as the change itself"
  once_settled: "generally more understeer through the middle; the overall front grip feel moves with this more than with the other keys"
less:
  reviewed: false
  confidence: majority
  before_settled: "the biggest bite change of the roll-centre keys, the other way — noticeably less initial steering, and more in the track; front vs rear counts as much as the change"
  once_settled: "generally more front grip through the middle, with more roll; the overall front grip feel moves with this more than with the other keys"
physics:
  - upper-link-geometry.md
sources:
  - "upper-link-geometry.md roll-centre table (solver-verified 2026-08-01)"
  - "Founder (JC), 2026-08-27 — lower arm = support + initial grip; upper links = bite + overall-grip feel; rear settled hedged like bar and spring"
  - "Opposite side: AI-drafted by inversion of the founder-reviewed side, 2026-08-27"
