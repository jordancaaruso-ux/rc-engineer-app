# FOUNDER-REVIEWED 2026-08-27 (JC pass) — promoted to the locked tier. Third sweep, founder-corrected 2026-08-27 (two passes). Roll-centre
# direction per key is solver-checked (upper-link-geometry.md); the feel lines are the founder's.
# HOW THE HUB FEELS DIFFERENT FROM THE OTHER ROLL-CENTRE KEYS: NOT YET DICTATED — these lines are the
# roll-centre direction only. Raises RC ~1.05 mm per 0.5 mm shim (about as strong as the lower arm); adds camber gain.
# v5 (2026-08-27): one entry per knob, both directions inside. The MORE side is the founder-reviewed text
# carried over from under-hub-rear-more.yaml; the LESS side is AI-DRAFTED by inversion and awaits his pass (reviewed: false).
# Founder, 2026-08-28: the relative change (front against rear) counts as much as the change itself — said on every side. An earlier
# wording, "front against rear is what you feel", read as "balance lever" and made these keys vanish from whole-car answers.
id: under_hub_shims_rear
discipline: touring
parameter: under_hub_shims_rear
label: "Rear under-hub shims"
words:
  more: "more — roll centre up"
  less: "fewer — roll centre down"
step: "0.5 mm; 0.25 mm is a small change, still noticeable"   # founder-dictated 2026-08-29; direction lives in the words, not here (a pickup-height step inverted upper-outer once, 12:45 same day)
two_answers: true
more:
  reviewed: true
  confidence: contested
  before_settled: "the rear bites sooner — more secure from the first input, and more on the track; rear against front counts as much as the change itself"
  once_settled: "tends toward oversteer through the middle; on exit it can go either way, depending on the day"
  contested:   # the settled-rear split (corner-regime.md); founder 2026-09-02: softer rear rotates most in long, slow corners. discriminator reworded to an on-track observable 2026-09-03 (the corner-clock question came out of the prompt: drivers cannot answer it accurately)
    claim_a: "rear roll centre up gives up rear grip once the car is leaning — oversteer through the middle"
    claim_b: "rear roll centre up gives more rear grip and less rotation — on track, often the way it goes"
    discriminator: "make the change and compare the long, slow turns against the quick direction changes: better in the quick ones and worse in the long ones means the rear roll centre has gone too high"
less:
  reviewed: false
  confidence: majority
  before_settled: "the rear bites later — less secure from the first input, and more in the track; rear against front counts as much as the change itself"
  once_settled: "tends toward more rear grip through the middle — the contested claim above, the other way; on exit it can go either way, depending on the day"
physics:
  - under-hub.md
sources:
  - "upper-link-geometry.md roll-centre table (solver-verified 2026-08-01)"
  - "Founder (JC), 2026-08-27 — lower arm = support + initial grip; upper links = bite + overall-grip feel; rear settled hedged like bar and spring"
  - "Opposite side: AI-drafted by inversion of the founder-reviewed side, 2026-08-27"
