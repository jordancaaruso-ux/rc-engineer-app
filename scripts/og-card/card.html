<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  The 1200x630 link-preview card, laid out in HTML and screenshotted by
  scripts/generate-og-card.mjs.

  Why HTML and not sharp compositing (the way scripts/generate-app-icons.mjs builds the icons):
  the brand faces are Google-hosted and NOT installed on the build machine, so librsvg silently
  falls back to DejaVu for any <text> — the headline would ship in the wrong typeface and nothing
  would fail. A browser fetches Sora properly, and gets real backdrop blur, gradients and shadows
  for free.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    background: #1B1A17;                 /* the one app background — never let a seam show through */
    font-family: "Sora", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The track, reduced to colour and shape. Scaled past the frame so the blur has material to
     sample at every edge instead of smearing the border inward. */
  .bg {
    position: absolute; inset: -80px;
    background: url("../../public/landing/assets/track-spiral.jpg") center 38% / cover no-repeat;
    filter: blur(38px) saturate(0.85);
    transform: scale(1.08);
  }

  /* Two washes: one flat toward the app background so the photo never competes, one left-heavy
     so the headline always has a dark field under it regardless of what the photo is doing. */
  .wash    { position: absolute; inset: 0; background: #1B1A17; opacity: 0.46; }
  .wash-lr {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, #14130F 4%, rgba(20,19,15,0.88) 38%, rgba(27,26,23,0.28) 72%, rgba(27,26,23,0) 100%);
  }

  .frame {
    position: absolute; inset: 0;
    display: flex; align-items: center;
    padding: 0 64px;                      /* safe area — Slack and Discord crop 1200x630 differently */
  }

  .copy { width: 592px; flex: none; }

  .mark { height: 40px; width: auto; display: block; opacity: 0.96; }

  h1 {
    margin-top: 30px;
    font-size: 62px; font-weight: 700; line-height: 1.06;
    letter-spacing: -0.022em; color: #FFFFFF;
  }

  /* The nav-sector rule from .page-title — 4px yellow bar on a hairline track, skewed to the
     angle of the cut in the JRC glyph. */
  .rule { margin-top: 26px; width: 300px; height: 2px; background: rgba(255,255,255,0.16); position: relative; }
  .rule::after {
    content: ""; position: absolute; left: 0; top: -1px;
    width: 74px; height: 4px; background: #FFD11A; transform: skewX(-21deg);
  }

  .sub {
    margin-top: 26px;
    font-size: 23px; font-weight: 400; line-height: 1.42;
    color: rgba(255,255,255,0.72); max-width: 520px;
  }

  /* The phone bleeds off the bottom edge so it reads as a device continuing past the frame
     rather than a rectangle pasted onto it. */
  .phone {
    position: absolute; right: 64px; top: 54px;
    /* Width is load-bearing, not taste: at 440 the 640x1385 source scales by 0.6875, so the 636px
       of visible box lands the crop just past the composer. Narrower and the cut falls inside the
       History list, which is the one part of the screen that says nothing to a stranger. */
    width: 440px; height: 636px;          /* taller than the card on purpose */
    border-radius: 26px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 40px 90px rgba(0,0,0,0.62), 0 0 0 1px rgba(0,0,0,0.35);
    background: #0E0D0C;
  }
  .phone img {
    width: 100%; display: block;
    /* 640x1385 source: show the header through the composer, which is the whole pitch in one
       frame — a real question, a real answer, and the car it is about. */
    margin-top: 0;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wash"></div>
  <div class="wash-lr"></div>

  <div class="frame">
    <div class="copy">
      <img class="mark" src="../../public/landing/assets/jrc-mark-white.svg" alt="" />
      <h1>Your next tenth<br />is in the data</h1>
      <div class="rule"></div>
      <p class="sub">Log a run in a minute. Ask how to make the car quicker &mdash; the answer comes from your own setups and lap times.</p>
    </div>
  </div>

  <div class="phone">
    <img src="../../public/landing/assets/shot-engineer.jpg" alt="" />
  </div>
</body>
</html>
